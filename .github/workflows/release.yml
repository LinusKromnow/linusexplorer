name: Release

# Pushing a tag like v0.3.1 builds the release APK on Linux, signs it with the upload key from the
# repository secrets and attaches it to a GitHub release. F-Droid rebuilds the same tag and checks
# its unsigned APK matches this one (reproducible builds), then ships it with this signature.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Build and sign
        env:
          KEYSTORE_BASE64: ${{ secrets.LINUSEXPLORER_KEYSTORE_BASE64 }}
          LINUSEXPLORER_KEYSTORE_PASSWORD: ${{ secrets.LINUSEXPLORER_KEYSTORE_PASSWORD }}
          LINUSEXPLORER_KEY_ALIAS: ${{ secrets.LINUSEXPLORER_KEY_ALIAS }}
          LINUSEXPLORER_KEY_PASSWORD: ${{ secrets.LINUSEXPLORER_KEY_PASSWORD }}
        run: |
          export LINUSEXPLORER_KEYSTORE="$RUNNER_TEMP/release.jks"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$LINUSEXPLORER_KEYSTORE"
          ./gradlew assembleRelease
          rm "$LINUSEXPLORER_KEYSTORE"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          code=$(sed -n 's/^ *versionCode = \([0-9]*\).*/\1/p' app/build.gradle.kts)
          apk="linusexplorer-$version.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          notes="fastlane/metadata/android/en-US/changelogs/$code.txt"
          gh release create "$GITHUB_REF_NAME" "$apk" --title "LinusExplorer $version" --notes-file "$notes"
